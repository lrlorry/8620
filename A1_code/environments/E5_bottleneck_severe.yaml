# Axis: passage width (severe). Same 2-obstacle wall as E4, but the gap is
# only 2 units wide at y in (24, 26) -- forces the 5 drones (spread over y
# in [15, 35]) to queue through nearly single-file. Canonical narrow-passage
# stress case for sampling-based planners.
bounds:
  x: [0, 50]
  y: [0, 50]
  z: [0, 50]

initial_configuration:
  - [2, 15, 25]
  - [2, 20, 25]
  - [2, 25, 25]
  - [2, 30, 25]
  - [2, 35, 25]

obstacles:
  - type: box
    position: [25, 12, 25]
    size: [3, 24, 50]
    rotation: [0, 0, 0]
    color: red
  - type: box
    position: [25, 38, 25]
    size: [3, 24, 50]
    rotation: [0, 0, 0]
    color: red

goals:
  - position: [48, 15, 25]
    radius: 1.2
  - position: [48, 20, 25]
    radius: 1.2
  - position: [48, 25, 25]
    radius: 1.2
  - position: [48, 30, 25]
    radius: 1.2
  - position: [48, 35, 25]
    radius: 1.2
