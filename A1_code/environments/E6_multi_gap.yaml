# Axis: passage redundancy (week3 slide 31 "Which one is easier to solve by
# sampling-based approaches?" and tutorial-w3 Q1 -- both compare a single
# narrow passage against multiple passages of the SAME width). Same 2-unit
# gap width as E5_bottleneck_severe, but 3 independent gaps instead of 1, at
# y in (19,21), (24,26), (29,31). Tests whether redundant routes of equal
# width are easier than one critical bottleneck, holding width constant.
bounds:
  x: [0, 50]
  y: [0, 50]
  z: [0, 50]

initial_configuration:
  - [2, 15, 25]
  - [2, 20, 25]
  - [2, 25, 25]
  - [2, 30, 25]
  - [2, 35, 25]

obstacles:
  - type: box
    position: [25, 9.5, 25]
    size: [3, 19, 50]
    rotation: [0, 0, 0]
    color: red
  - type: box
    position: [25, 22.5, 25]
    size: [3, 3, 50]
    rotation: [0, 0, 0]
    color: red
  - type: box
    position: [25, 27.5, 25]
    size: [3, 3, 50]
    rotation: [0, 0, 0]
    color: red
  - type: box
    position: [25, 40.5, 25]
    size: [3, 19, 50]
    rotation: [0, 0, 0]
    color: red

goals:
  - position: [48, 15, 25]
    radius: 1.2
  - position: [48, 20, 25]
    radius: 1.2
  - position: [48, 25, 25]
    radius: 1.2
  - position: [48, 30, 25]
    radius: 1.2
  - position: [48, 35, 25]
    radius: 1.2
